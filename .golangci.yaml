version: "2"
run:
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errname
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - godot
    - importas
  settings:
    govet: { enable-all: true, disable: [shadow, fieldalignment] }
    staticcheck: { checks: [all] }
    gocritic: { disabled-checks: [ifElseChain] }
    revive:
      rules:
        - { name: package-comments, disabled: true }
    importas:
      no-unaliased: true
      alias:
        - { pkg: github.com/openfga/api/proto/openfga/v1, alias: openfgav1 }
    depguard:
      rules:
        main:
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/gocarina/gocsv
            - github.com/hashicorp/go-multierror
            - github.com/mattn/go-isatty
            - github.com/muesli/mango-cobra
            - github.com/muesli/roff
            - github.com/nwidger/jsoncolor
            - github.com/oklog/ulid/v2
            - github.com/openfga/api
            - github.com/openfga/cli
            - github.com/openfga/go-sdk
            - github.com/openfga/language
            - github.com/openfga/openfga
            - github.com/schollz/progressbar/v3
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/spf13/viper
            - golang.org/x/time/rate
            - google.golang.org/protobuf/encoding/protojson
            - google.golang.org/protobuf/proto
            - google.golang.org/protobuf/types/known/structpb
            - gopkg.in/yaml.v3
        test:
          files:
            - $test
          allow:
            - $gostd
            - github.com/golang/mock/gomock
            - github.com/openfga/api/proto
            - github.com/openfga/cli
            - github.com/openfga/go-sdk
            - github.com/openfga/openfga
            - github.com/stretchr
            - go.uber.org/mock/gomock
            - github.com/spf13/cobra
            - github.com/spf13/viper
            - google.golang.org/protobuf/proto
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - { linters: [errcheck, bodyclose], path: (.+)_test.go }
      - { linters: [errcheck], source: ^\s*defer\s+ }
      - linters: [revive]
        text: "avoid package names that conflict with Go standard library package names"
        path: internal/slices
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt: { simplify: true }
    goimports:
      local-prefixes:
        - github.com/openfga/cli
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
