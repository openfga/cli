config:
  inherit-env: true

tests:
  # run is a deprecated alias for evaluate
  001 - evaluate emits JSONL tuple from stdin:
    command: bash -c 'echo '"'"'{"id":"anne","org":"acme"}'"'"' | fga mapping evaluate ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      json:
        op: "write"
        user: "user:anne"
        relation: "member"
        object: "org:acme"

  002 - evaluate --writes-only emits ClientTupleKey shape without op or action field:
    command: bash -c 'echo '"'"'{"id":"anne","org":"acme"}'"'"' | fga mapping evaluate --writes-only ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      json:
        user: "user:anne"
        relation: "member"
        object: "org:acme"
      not-contains:
        - '"op"'
        - '"action"'

  003 - evaluate --input reads from file:
    command: fga mapping evaluate --input ./tests/fixtures/mapping-event.json ./tests/fixtures/basic-mapping.yaml
    exit-code: 0
    stdout:
      json:
        op: "write"
        user: "user:anne"

  004 - evaluate --format json --writes-only returns a flat array of tuples:
    command: bash -c 'echo '"'"'{"id":"anne","org":"acme"}'"'"' | fga mapping evaluate --format json --writes-only ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      json:
        0.user: "user:anne"

  005 - evaluate --format json returns a batch object with writes:
    command: bash -c 'echo '"'"'{"id":"anne","org":"acme"}'"'"' | fga mapping evaluate --format json ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      json:
        writes.0.user: "user:anne"

  006 - evaluate rejects unknown format:
    command: bash -c 'echo '"'"'{}'"'"' | fga mapping evaluate --format xml ./tests/fixtures/basic-mapping.yaml'
    exit-code: 2

  007 - evaluate rejects invalid mapping:
    command: bash -c 'echo '"'"'{}'"'"' | fga mapping evaluate ./tests/fixtures/invalid-mapping.yaml'
    exit-code: 2
    stderr:
      contains:
        - "unclosed"

  008 - evaluate streams one op per record for multi-record input:
    command: bash -c 'printf '"'"'{"id":"anne","org":"acme"}\n{"id":"bob","org":"acme"}\n'"'"' | fga mapping evaluate ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      line-count: 2
      contains:
        - "user:anne"
        - "user:bob"

  009 - evaluate --aggregate dedups an identical tuple across records:
    command: bash -c 'printf '"'"'{"id":"anne","org":"acme"}\n{"id":"anne","org":"acme"}\n'"'"' | fga mapping evaluate --aggregate ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      line-count: 1

  010 - evaluate --aggregate reports a cross-record write/delete conflict:
    command: bash -c 'printf '"'"'{"id":"anne","org":"acme","op":"add"}\n{"id":"anne","org":"acme","op":"remove"}\n'"'"' | fga mapping evaluate --aggregate ./tests/fixtures/conflicting-mapping.yaml'
    exit-code: 1
    stderr:
      contains:
        - "conflict"

  011 - evaluate --continue-on-error skips a malformed record and exits non-zero:
    command: bash -c 'printf '"'"'{"id":"anne","org":"acme"}\nnot json\n{"id":"bob","org":"acme"}\n'"'"' | fga mapping evaluate --continue-on-error ./tests/fixtures/basic-mapping.yaml'
    exit-code: 1
    stdout:
      line-count: 2
      contains:
        - "user:anne"
        - "user:bob"
    stderr:
      contains:
        - "skipping record on line 2"

  012 - evaluate --continue-on-error with all valid records exits zero:
    command: bash -c 'printf '"'"'{"id":"anne","org":"acme"}\n{"id":"bob","org":"acme"}\n'"'"' | fga mapping evaluate --continue-on-error ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      line-count: 2

  013 - evaluate --aggregate dedups identical unresolved filters across records:
    command: bash -c 'printf '"'"'{"id":"anne","org":"acme"}\n{"id":"anne","org":"acme"}\n'"'"' | fga mapping evaluate --aggregate --format json ./tests/fixtures/filter-mapping.yaml'
    exit-code: 0
    stdout:
      json:
        tuple_filter_operations.#: "1"

  014 - run alias prints deprecation warning and still produces output:
    command: bash -c 'echo '"'"'{"id":"anne","org":"acme"}'"'"' | fga mapping run ./tests/fixtures/basic-mapping.yaml'
    exit-code: 0
    stdout:
      json:
        op: "write"
        user: "user:anne"
        relation: "member"
        object: "org:acme"
    stderr:
      contains:
        - "deprecated"
