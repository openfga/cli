config:
  inherit-env: true

tests:
  001 - init creates a mapping file:
    command: fga mapping init /tmp/fga-mapping-test-$$.yaml
    exit-code: 0
    stdout:
      contains:
        - "Created"

  002 - init --minimal creates file without tests block:
    command: bash -c 'fga mapping init --minimal /tmp/fga-mapping-minimal-test-$$.yaml && cat /tmp/fga-mapping-minimal-test-$$.yaml'
    exit-code: 0
    stdout:
      not-contains:
        - "tests:"
