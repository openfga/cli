config:
  inherit-env: true

tests:
  # fga mapping validate
  001 - validate accepts a valid mapping:
    command: fga mapping validate ./tests/fixtures/basic-mapping.yaml
    exit-code: 0
    stdout:
      contains:
        - "valid"

  002 - validate json format reports rule count:
    command: fga mapping validate --format json ./tests/fixtures/basic-mapping.yaml
    exit-code: 0
    stdout:
      json:
        valid: "true"
        rule_count: "1"

  003 - validate rejects an invalid mapping:
    command: fga mapping validate ./tests/fixtures/invalid-mapping.yaml
    exit-code: 2
    stderr:
      contains:
        - "unclosed"

  004 - validate json format reports errors on invalid mapping:
    command: fga mapping validate --format json ./tests/fixtures/invalid-mapping.yaml
    exit-code: 2
    stdout:
      json:
        valid: "false"

  005 - validate rejects unknown format:
    command: fga mapping validate --format xml ./tests/fixtures/basic-mapping.yaml
    exit-code: 2

  # fga mapping test
  006 - test runs passing tests:
    command: fga mapping test ./tests/fixtures/basic-mapping.yaml
    exit-code: 0
    stdout:
      json:
        total: 2
        passed: 2
        failed: 0

  007 - test reports failure and exits non-zero:
    command: fga mapping test ./tests/fixtures/invalid-mapping.yaml
    exit-code: 1

  008 - test --run filters by substring:
    command: fga mapping test --run anne ./tests/fixtures/basic-mapping.yaml
    exit-code: 0
    stdout:
      json:
        total: 1
        filtered: 1

  009 - test --run matching nothing exits non-zero:
    command: fga mapping test --run NOMATCH ./tests/fixtures/basic-mapping.yaml
    exit-code: 1
    stderr:
      contains: "matched no tests"
